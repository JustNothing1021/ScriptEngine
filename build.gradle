plugins {
    id 'java-library'
    id 'application'
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.justnothing.engine.repl.EvalRepl'
}

run {
    standardInput = System.in
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

test {
    // 解析器拆分探针透传（说明见 ParseContext 的"拆分探针"一节）：
    //   -Pengine.parser.noClassResolution=true  关掉解析期类解析
    //   -Pengine.parser.noTypeAnnotation=true   关掉解析期类型标注
    //   -Pengine.parser.noSemanticChecks=true   关掉解析期语义校验
    //   -Pengine.parser.probeScope=all          连运行期一起退化（对照组，默认 parse=只作用解析期）
    ['noClassResolution', 'noTypeAnnotation', 'noSemanticChecks', 'probeScope'].each { name ->
        if (findProperty("engine.parser.$name") != null) {
            systemProperty "engine.parser.$name", findProperty("engine.parser.$name")
        }
    }
    jvmArgs += [
        '--add-opens', 'java.base/java.util.stream=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    ]
}